<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prehistoric Scene</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #172d2c;
        font-family: Arial, sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      button {
        position: fixed;
        top: 15px;
        right: 15px;
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        background: rgba(20, 45, 42, 0.8);
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: #244e49;
      }
    </style>
  </head>

  <body>
    <canvas id="canvas"></canvas>

    <button id="newPicture">New Picture</button>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let width;
      let height;
      let randomSeed = 10;

      function random(min, max) {
        randomSeed = (randomSeed * 1664525 + 1013904223) >>> 0;
        return min + (randomSeed / 4294967296) * (max - min);
      }

      function resizeCanvas() {
        const scale = Math.min(window.devicePixelRatio || 1, 2);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * scale;
        canvas.height = height * scale;

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(scale, 0, 0, scale, 0, 0);

        drawScene();
      }

      window.addEventListener("resize", resizeCanvas);

      /* Small drawing helpers */

      function circle(x, y, radius, color) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      }

      function oval(x, y, rx, ry, color, angle = 0) {
        ctx.save();

        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);

        ctx.fillStyle = color;
        ctx.fill();

        ctx.restore();
      }

      function drawLine(x1, y1, x2, y2, color, size) {
        ctx.beginPath();

        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);

        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.lineCap = "round";

        ctx.stroke();
      }

      function fillShape(points, color) {
        ctx.beginPath();

        ctx.moveTo(points[0][0], points[0][1]);

        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i][0], points[i][1]);
        }

        ctx.closePath();

        ctx.fillStyle = color;
        ctx.fill();
      }

      /* Sky */

      function drawSky() {
        const sky = ctx.createLinearGradient(0, 0, 0, height);

        sky.addColorStop(0, "#0ca5d0");
        sky.addColorStop(0.45, "#39c5e0");
        sky.addColorStop(0.72, "#a8e2d5");
        sky.addColorStop(1, "#dfe0a6");

        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        // Light brush marks in the sky
        for (let i = 0; i < 250; i++) {
          const x = random(0, width);
          const y = random(0, height * 0.65);

          drawLine(
            x,
            y,
            x + random(-30, 30),
            y + random(-10, 10),
            ["#159dcc", "#56c9df", "#86d9e3", "#b7e8df"][
              Math.floor(random(0, 4))
            ],
            random(2, 8),
          );
        }

        // Clouds
        ctx.globalAlpha = 0.18;

        for (let i = 0; i < 25; i++) {
          oval(
            width * 0.55 + random(-180, 180),
            height * 0.35 + random(-50, 50),
            random(60, 180),
            random(10, 35),
            "#ffffff",
            random(-0.2, 0.2),
          );
        }

        ctx.globalAlpha = 1;
      }

      /* Mountains */

      function drawMountains() {
        fillShape(
          [
            [0, height * 0.7],
            [width * 0.1, height * 0.65],
            [width * 0.22, height * 0.67],
            [width * 0.32, height * 0.59],
            [width * 0.43, height * 0.66],
            [width * 0.55, height * 0.61],
            [width * 0.67, height * 0.67],
            [width * 0.8, height * 0.6],
            [width, height * 0.65],
            [width, height * 0.8],
            [0, height * 0.8],
          ],
          "#65b7bb",
        );

        fillShape(
          [
            [width * 0.2, height * 0.7],
            [width * 0.32, height * 0.61],
            [width * 0.43, height * 0.69],
            [width * 0.53, height * 0.63],
            [width * 0.66, height * 0.69],
            [width * 0.76, height * 0.62],
            [width, height * 0.68],
            [width, height * 0.79],
            [width * 0.2, height * 0.79],
          ],
          "#98cec8",
        );
      }

      /* Ground */

      function drawGround() {
        const ground = ctx.createLinearGradient(0, height * 0.67, 0, height);

        ground.addColorStop(0, "#dce5aa");
        ground.addColorStop(0.4, "#9fb96f");
        ground.addColorStop(1, "#315844");

        ctx.fillStyle = ground;
        ctx.fillRect(0, height * 0.67, width, height * 0.33);

        // Grass
        for (let i = 0; i < 180; i++) {
          const x = random(0, width);
          const y = random(height * 0.72, height);
          const h = random(4, 18);

          drawLine(
            x,
            y,
            x + random(-5, 5),
            y - h,
            ["#315e42", "#557746", "#718a4d"][Math.floor(random(0, 3))],
            random(1, 2),
          );
        }
      }

      /* Trees */

      function drawTree(x, y, size) {
        ctx.fillStyle = "#496847";

        fillShape(
          [
            [x - 15 * size, y],
            [x - 10 * size, y - 170 * size],
            [x - 25 * size, y - 300 * size],
            [x + 5 * size, y - 285 * size],
            [x + 20 * size, y - 170 * size],
            [x + 25 * size, y],
          ],
          "#496847",
        );

        const leaves = ["#0e624b", "#167651", "#2d8a5a", "#4c9c61", "#72aa63"];

        for (let i = 0; i < 35; i++) {
          const yPos = random(y - 280 * size, y - 70 * size);

          const spread = 100 * size;

          oval(
            x + random(-spread, spread),
            yPos,
            random(20, 55) * size,
            random(25, 65) * size,
            leaves[Math.floor(random(0, leaves.length))],
            random(-0.7, 0.7),
          );
        }
      }

      /* Elephant */

      function drawElephant(x, y, size) {
        const body = "#647d73";
        const darkBody = "#536e66";

        // Body
        oval(x, y - 60 * size, 75 * size, 55 * size, body);

        // Head
        oval(x + 48 * size, y - 100 * size, 42 * size, 45 * size, "#718a7e");

        // Ears
        oval(
          x + 18 * size,
          y - 100 * size,
          30 * size,
          55 * size,
          darkBody,
          -0.5,
        );

        oval(
          x + 75 * size,
          y - 100 * size,
          30 * size,
          50 * size,
          darkBody,
          0.5,
        );

        // Trunk
        ctx.beginPath();

        ctx.moveTo(x + 70 * size, y - 85 * size);

        ctx.bezierCurveTo(
          x + 110 * size,
          y - 65 * size,
          x + 105 * size,
          y - 35 * size,
          x + 135 * size,
          y - 45 * size,
        );

        ctx.strokeStyle = body;
        ctx.lineWidth = 17 * size;
        ctx.lineCap = "round";
        ctx.stroke();

        // Tusks
        ctx.strokeStyle = "#eee5c0";
        ctx.lineWidth = 3 * size;

        ctx.beginPath();
        ctx.arc(x + 65 * size, y - 76 * size, 28 * size, 0.4, 1.3);
        ctx.stroke();

        // Legs
        [-45, -15, 25, 50].forEach((offset) => {
          const legX = x + offset * size;

          fillShape(
            [
              [legX - 12 * size, y - 40 * size],
              [legX + 12 * size, y - 40 * size],
              [legX + 14 * size, y + 45 * size],
              [legX - 12 * size, y + 45 * size],
            ],
            darkBody,
          );
        });
      }

      /* Simple prehistoric person */

      function drawPerson(x, y, size, direction = 1) {
        const skin = "#664936";
        const hair = "#292724";

        // Legs
        drawLine(
          x - 7 * size,
          y + 15 * size,
          x - 28 * size * direction,
          y + 65 * size,
          skin,
          12 * size,
        );

        drawLine(
          x + 7 * size,
          y + 15 * size,
          x + 30 * size * direction,
          y + 65 * size,
          skin,
          12 * size,
        );

        // Body
        oval(x, y - 25 * size, 25 * size, 42 * size, skin);

        // Head
        circle(x + 5 * size * direction, y - 75 * size, 19 * size, skin);

        // Hair
        oval(
          x + 5 * size * direction,
          y - 85 * size,
          22 * size,
          13 * size,
          hair,
        );

        // Arms
        drawLine(
          x - 15 * size,
          y - 40 * size,
          x - 42 * size * direction,
          y - 5 * size,
          skin,
          9 * size,
        );

        drawLine(
          x + 15 * size,
          y - 40 * size,
          x + 42 * size * direction,
          y - 10 * size,
          skin,
          9 * size,
        );
      }

      /* Main large figure */

      function drawLargePerson(x, y, size) {
        const dark = "#302a27";
        const body = "#4d3e36";
        const skin = "#76533d";

        // Body
        oval(x, y - 15 * size, 65 * size, 90 * size, body);

        // Shoulders
        oval(x - 15 * size, y - 70 * size, 70 * size, 70 * size, skin);

        // Head
        circle(x, y - 110 * size, 43 * size, skin);

        // Hair
        oval(x, y - 130 * size, 45 * size, 25 * size, dark);

        // Face
        oval(x + 3 * size, y - 105 * size, 27 * size, 30 * size, "#956b4c");

        // Eyes
        circle(x - 10 * size, y - 108 * size, 5 * size, "#29231f");

        circle(x + 12 * size, y - 108 * size, 5 * size, "#29231f");

        // Nose
        fillShape(
          [
            [x - 3 * size, y - 100 * size],
            [x + 10 * size, y - 100 * size],
            [x + 5 * size, y - 83 * size],
            [x - 5 * size, y - 84 * size],
          ],
          "#52392d",
        );

        // Mouth
        drawLine(
          x - 8 * size,
          y - 72 * size,
          x + 17 * size,
          y - 70 * size,
          "#2a2421",
          4 * size,
        );

        // Arms
        drawLine(
          x - 40 * size,
          y - 30 * size,
          x - 80 * size,
          y + 70 * size,
          "#493932",
          27 * size,
        );

        drawLine(
          x + 40 * size,
          y - 30 * size,
          x + 75 * size,
          y + 70 * size,
          "#493932",
          27 * size,
        );

        // Legs
        oval(
          x - 40 * size,
          y + 80 * size,
          70 * size,
          27 * size,
          "#403531",
          -0.25,
        );

        oval(
          x + 40 * size,
          y + 80 * size,
          70 * size,
          27 * size,
          "#3d332f",
          0.25,
        );

        // Stone
        oval(x + 5 * size, y + 90 * size, 28 * size, 17 * size, "#b5a36d");
      }

      /* Fire */

      function drawFire() {
        const x = width * 0.11;
        const y = height * 0.93;

        for (let i = 0; i < 10; i++) {
          oval(
            x + random(-25, 25),
            y + random(-8, 8),
            random(7, 18),
            random(4, 10),
            ["#8b4a28", "#b7642f", "#d38b3b"][i % 3],
          );
        }

        for (let i = 0; i < 8; i++) {
          const flameX = x + random(-18, 18);
          const flameY = y - random(10, 50);
          const flameWidth = random(5, 12);
          const flameHeight = random(20, 40);

          fillShape(
            [
              [flameX, flameY],
              [flameX - flameWidth, flameY + flameHeight * 0.55],
              [flameX, flameY + flameHeight],
              [flameX + flameWidth, flameY + flameHeight * 0.55],
            ],
            ["#d45b27", "#ed9138", "#f1bd50"][i % 3],
          );
        }
      }

      /* Background people */

      function drawSmallPeople() {
        drawPerson(width * 0.52, height * 0.84, 0.7, 1);

        drawPerson(width * 0.69, height * 0.91, 0.65, 1);

        drawPerson(width * 0.76, height * 0.92, 0.72, -1);

        drawPerson(width * 0.84, height * 0.96, 0.55, 1);

        drawPerson(width * 0.9, height * 0.94, 0.5, -1);
      }

      /* Main scene */

      function drawScene() {
        ctx.clearRect(0, 0, width, height);

        drawSky();
        drawMountains();
        drawGround();

        // Trees on the right
        drawTree(width * 0.86, height * 0.8, 1.1);
        drawTree(width * 0.76, height * 0.8, 0.7);
        drawTree(width * 0.7, height * 0.8, 0.5);

        // Elephant
        drawElephant(width * 0.59, height * 0.8, 0.8);

        drawSmallPeople();

        // People on the left
        drawPerson(width * 0.16, height * 0.84, 1.1, -1);

        drawPerson(width * 0.09, height * 0.86, 0.85, 1);

        drawPerson(width * 0.27, height * 0.87, 0.9, -1);

        // Main foreground character
        drawLargePerson(width * 0.36, height * 0.92, 1);

        drawFire();

        // A few foreground plants
        for (let i = 0; i < 60; i++) {
          oval(
            random(0, width),
            random(height * 0.8, height),
            random(7, 20),
            random(4, 12),
            ["#244f3d", "#386946", "#557c4b"][i % 3],
            random(-0.8, 0.8),
          );
        }
      }

      /* Button */

      document
        .getElementById("newPicture")
        .addEventListener("click", function () {
          randomSeed = Math.random() * 100000;
          drawScene();
        });

      resizeCanvas();
    </script>
  </body>
</html>
